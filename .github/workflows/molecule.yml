---
name: Molecule CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]

env:
  PY_COLORS: "1"
  ANSIBLE_FORCE_COLOR: "1"
  # Pin collections to ~/.ansible/collections only — prevents ansible-galaxy
  # from picking up any project-local .ansible/collections stubs.
  ANSIBLE_COLLECTIONS_PATH: "~/.ansible/collections:/usr/share/ansible/collections"

jobs:
  lint:
    name: Lint (yamllint + ansible-lint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install linting tools
        run: pip install yamllint ansible-lint ansible-core

      - name: Install collection dependencies
        run: ansible-galaxy collection install -r requirements.yml

      - name: Run yamllint
        run: yamllint .

      - name: Run ansible-lint on all roles
        run: |
          for role in roles/*/; do
            echo "--- Linting: $role ---"
            ansible-lint "$role"
          done

  molecule:
    name: Molecule — ${{ matrix.role }} / ${{ matrix.distro }}
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        role:
          - base
          - pathfinder
          - juno
          - snapshot
        distro:
          - ubuntu2204
          - debian12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Molecule and dependencies
        run: pip install -r requirements.txt

      - name: Install Ansible collections
        run: ansible-galaxy collection install -r requirements.yml

      - name: Build and install starknet_ops.node_toolkit collection
        run: |
          ansible-galaxy collection build --force
          ansible-galaxy collection install ./starknet_ops-node_toolkit-*.tar.gz \
            -p ~/.ansible/collections

      - name: Run Molecule test
        run: molecule test
        working-directory: roles/${{ matrix.role }}
        env:
          MOLECULE_DISTRO: ${{ matrix.distro }}

  collection-build:
    name: Collection Build Validation
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ansible-core
        run: pip install ansible-core

      - name: Build collection
        run: ansible-galaxy collection build --force

      - name: Verify tarball was created
        run: ls -la starknet_ops-node_toolkit-*.tar.gz
