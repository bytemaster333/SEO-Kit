---
dependency:
  name: galaxy
  options:
    requirements-file: ${MOLECULE_PROJECT_DIRECTORY}/../../../../requirements.yml

driver:
  name: docker

platforms:
  - name: juno-ubuntu2204
    image: geerlingguy/docker-ubuntu2204-ansible:latest
    pre_build_image: true
    privileged: false
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    command: /lib/systemd/systemd
    capabilities:
      - SYS_ADMIN
      - NET_ADMIN
    tmpfs:
      - /run
      - /run/lock

  - name: juno-debian12
    image: geerlingguy/docker-debian12-ansible:latest
    pre_build_image: true
    privileged: false
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    command: /lib/systemd/systemd
    capabilities:
      - SYS_ADMIN
      - NET_ADMIN
    tmpfs:
      - /run
      - /run/lock

provisioner:
  name: ansible
  config_options:
    defaults:
      interpreter_python: auto_silent
      callback_whitelist: profile_tasks, timer
    ssh_connection:
      pipelining: true
  inventory:
    group_vars:
      all:
        juno_health_check_enabled: false
        juno_ethereum_url: "http://mock-l1-rpc.test:8545"
        juno_network: sepolia
        juno_version: "0.12.5"
        # Keep service enabled but do not start — stub binary cannot serve RPC
        juno_service_state: stopped

verifier:
  name: ansible

lint: |
  set -e
  yamllint .
  ansible-lint
