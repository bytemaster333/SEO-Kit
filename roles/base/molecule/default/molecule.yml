---
dependency:
  name: galaxy
  options:
    requirements-file: ${MOLECULE_PROJECT_DIRECTORY}/../../../../requirements.yml

driver:
  name: docker

platforms:
  - name: base-ubuntu2204
    image: geerlingguy/docker-ubuntu2204-ansible:latest
    pre_build_image: true
    privileged: false
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    command: /lib/systemd/systemd
    capabilities:
      - SYS_ADMIN
      - NET_ADMIN
    tmpfs:
      - /run
      - /run/lock

  - name: base-debian12
    image: geerlingguy/docker-debian12-ansible:latest
    pre_build_image: true
    privileged: false
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    command: /lib/systemd/systemd
    capabilities:
      - SYS_ADMIN
      - NET_ADMIN
    tmpfs:
      - /run
      - /run/lock

provisioner:
  name: ansible
  config_options:
    defaults:
      interpreter_python: auto_silent
      callback_whitelist: profile_tasks, timer
    ssh_connection:
      pipelining: true
  inventory:
    group_vars:
      all:
        base_service_users:
          - name: pathfinder
            shell: /usr/sbin/nologin
            home: /var/lib/pathfinder
            groups: []
          - name: juno
            shell: /usr/sbin/nologin
            home: /var/lib/juno
            groups: []

verifier:
  name: ansible

lint: |
  set -e
  yamllint .
  ansible-lint
