---
- name: Prepare
  hosts: all
  gather_facts: false
  tasks:
    - name: Wait for systemd to become ready  # noqa: command-instead-of-module
      ansible.builtin.command: systemctl is-system-running
      register: base_systemd_status
      retries: 12
      delay: 5
      until: base_systemd_status.stdout in ['running', 'degraded']
      changed_when: false
      failed_when: false
