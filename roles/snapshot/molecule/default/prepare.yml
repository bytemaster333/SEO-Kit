---
- name: Prepare
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Wait for systemd to become ready  # noqa: command-instead-of-module
      ansible.builtin.command: systemctl is-system-running
      register: snapshot_systemd_status
      retries: 12
      delay: 5
      until: snapshot_systemd_status.stdout in ['running', 'degraded']
      changed_when: false
      failed_when: false

    - name: Create mock pathfinder data directory for snapshot test
      ansible.builtin.file:
        path: /var/lib/pathfinder/data
        owner: root
        group: root
        mode: "0755"
        state: directory

    - name: Create mock data file to verify snapshot
      ansible.builtin.copy:
        dest: /var/lib/pathfinder/data/mock.db
        content: "mock starknet database"
        mode: "0644"
